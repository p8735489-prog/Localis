name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || {
            echo "::error::SIGNING_KEYSTORE_B64 is not configured."
            exit 1
          }
          echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/localis-release.jks"
          test -s "$RUNNER_TEMP/localis-release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/localis-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::Release APK was not produced."; exit 1; }
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          cp "$APK" "Localis-2.1.0-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Localis-2.1.0-release.apk
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/localis-release.jks"
