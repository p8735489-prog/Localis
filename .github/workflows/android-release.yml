name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  CMAKE_VERSION: "3.22.1"
  NDK_VERSION: "27.2.12479018"
  JAVA_VERSION: "17"
  SIGNING_KEYSTORE_PATH: app/localis-release.jks
  SIGNING_STORE_PASSWORD: localis2024
  SIGNING_KEY_ALIAS: localis
  SIGNING_KEY_PASSWORD: localis2024

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-cleanup: on-success

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Verify signing keystore
        run: |
          test -f "$SIGNING_KEYSTORE_PATH" || { echo "::error::Keystore not found: $SIGNING_KEYSTORE_PATH"; exit 1; }
          keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::Keystore validation failed"; exit 1; }
          echo "Keystore OK"

      - name: Fetch upstream llama.cpp mtmd runtime
        shell: bash
        run: |
          chmod +x tools/fetch_mtmd.sh
          LLAMA_CPP_MTMD_REF=master tools/fetch_mtmd.sh || echo "::warning::fetch_mtmd.sh failed, building without mtmd"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Source preflight
        run: python3 tools/ci_preflight.py

      - name: Static release audit
        run: python3 tools/release_audit.py

      - name: Check Gradle and project configuration
        run: gradle --version && gradle :app:tasks --all --no-daemon --stacktrace >/tmp/localis-gradle-tasks.txt

      - name: Build signed Release APK
        env:
          CI: "true"
        run: gradle clean assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest application-id "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest version-name "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest version-code "$APK"

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          cp "$APK" "Localis-2.1.0-release.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Localis-2.1.0-release
          path: Localis-2.1.0-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Localis-2.1.0-release.apk
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
