name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  CMAKE_VERSION: "3.22.1"
  NDK_VERSION: "27.2.12479018"
  JAVA_VERSION: "17"

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-cleanup: on-success

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Validate release secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing SIGNING_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/localis-release.jks"
          test -s "$RUNNER_TEMP/localis-release.jks"

      - name: Fetch upstream llama.cpp mtmd runtime
        run: |
          chmod +x tools/fetch_mtmd.sh
          LLAMA_CPP_MTMD_REF=master tools/fetch_mtmd.sh
          test -f app/src/main/cpp/llama_src/tools/mtmd/CMakeLists.txt

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Source preflight
        run: python3 tools/ci_preflight.py

      - name: Static release audit
        run: python3 tools/release_audit.py

      - name: Check Gradle and project configuration
        run: gradle --version && gradle :app:tasks --all --no-daemon --stacktrace >/tmp/localis-gradle-tasks.txt

      - name: Build signed Release APK
        env:
          CI: "true"
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/localis-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle clean assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest application-id "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest version-name "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" manifest version-code "$APK"

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          cp "$APK" "Localis-2.1.0-release.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Localis-2.1.0-release
          path: Localis-2.1.0-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Localis-2.1.0-release.apk
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/localis-release.jks"
