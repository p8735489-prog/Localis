name: Localis Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'
  CMAKE_VERSION: '3.22.1'
  NDK_VERSION: '27.2.12479018'
  JAVA_VERSION: '17'
  SIGNING_KEYSTORE_PATH: /tmp/localis-release.jks

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore native src symlink
        shell: bash
        run: |
          set -euo pipefail
          cd app/src/main/cpp
          rm -rf src
          ln -sfn llama_src src
          test -L src
          test -e src
          echo "src -> $(readlink src)"

      - name: Restore release signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing SIGNING_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing SIGNING_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          test -s "$SIGNING_KEYSTORE_PATH"
          keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare llama.cpp MTMD native runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_mtmd.sh tools/check_native_tree.py
          LLAMA_CPP_MTMD_REF=b10218 tools/fetch_mtmd.sh
          python3 tools/check_native_tree.py
          test -f app/src/main/cpp/vendor/cpp-httplib/CMakeLists.txt
          test -f app/src/main/cpp/vendor/cpp-httplib/httplib.h
          test -f app/src/main/cpp/llama_src/tools/mtmd/CMakeLists.txt
          python3 tools/normalize_mtmd_cmake.py app/src/main/cpp/llama_src/tools/mtmd/CMakeLists.txt
          ! grep -Eq '^[[:space:]]*VERSION[[:space:]]+\\\$\\\{LLAMA_INSTALL_VERSION\\\}' app/src/main/cpp/llama_src/tools/mtmd/CMakeLists.txt

      - name: Remove stale native build cache
        shell: bash
        run: |
          rm -rf app/.cxx app/build/.cxx

      - name: Run native CI preflight
        run: python3 tools/ci_preflight.py

      - name: Run release configuration audit
        run: python3 tools/release_audit.py

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          cp "$APK" Localis-debug.apk

      - name: Verify release signing inputs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SIGNING_KEYSTORE_PATH"
          test -n "${SIGNING_STORE_PASSWORD:-}"
          test -n "${SIGNING_KEY_ALIAS:-}"
          test -n "${SIGNING_KEY_PASSWORD:-}"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          cp "$APK" Localis-release.apk

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$SIGNING_KEYSTORE_PATH"

      - name: Upload debug artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Localis-debug
          path: Localis-debug.apk
          if-no-files-found: error

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Localis-release
          path: Localis-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Localis-release.apk
