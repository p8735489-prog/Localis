name: Legacy build workflow (disabled)

# Kept only so an existing repository can safely overwrite the old
# build-apk.yml file when this project is uploaded. It has no automatic
# triggers and therefore cannot race the canonical android-release.yml.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain migration
        run: echo 'Legacy build-apk.yml is intentionally disabled. Use android-release.yml.'
